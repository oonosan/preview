<!doctype html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container">
  <app-root></app-root>

  <!--
    Static copy of the contact form so Netlify detects it at deploy time
    (Angular renders the real form in the browser, which Netlify can't see).
    Field names must match the contactForm in src/app/home/home.ts.
  -->
  <form name="contact-newcomer" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
